name: Deploy fallback to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build GitHub Pages artifact
        env:
          PUBLIC_SITE_URL: https://limaduzz11.github.io
          PUBLIC_BASE_PATH: /nova-abme/
        run: npm run verify

      - name: Align fallback sitemap
        run: node --input-type=module -e "import { writeFile } from 'node:fs/promises'; await writeFile('dist/robots.txt', 'User-agent: *\\nAllow: /\\n\\nSitemap: https://limaduzz11.github.io/nova-abme/sitemap-index.xml\\n');"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
